INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

OPTIM:
  NAME: "adamw"
  LR: 0.005
  WEIGHT_DECAY: 5e-4
  ADAM_BETA1: 0.9
  ADAM_BETA2: 0.999
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 5
  CHECKPOINT_FREQ: 10

TEST:
  PER_CLASS_RESULT: True
  COMPUTE_CMAT: True
  FINAL_MODEL: "last_step"
  BEST_METRIC: "accuracy"
  SAVE_BEST_METRICS: ["accuracy", "balanced_accuracy"]
  SKIP_FINAL_TEST: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  COOP:
    CTX_INIT: "a photo of a"
    N_CTX: 4
    CSC: False
    PREC: "fp32"
    CLASS_TOKEN_POSITION: "end"
  COOPVPT:
    PREC: "fp32"
    VPT_N_CTX: 4
    VPT_DROPOUT: 0.0
  TCP:
    ENABLED: True
    DESCRIPTION_CACHE: ""
    LAYER_DESCRIPTION_CACHE: ""
    BOTTLENECK_DIM: 128
    INSERT_LAYER: 8
    GATE_INIT: 0.05
  CONFUSION_AWARE:
    BANK_ROOT: "output/soft_confusion_banks"
    PRIOR_ALPHA: 1.0
    GAMMA: 0.2
    LAMBDA_CONF: 1.0
