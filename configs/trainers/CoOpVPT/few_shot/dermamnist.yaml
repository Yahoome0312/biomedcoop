DATALOADER:
  NUM_WORKERS: 4
  PERSISTENT_WORKERS: True
  TRAIN_X:
    BATCH_SIZE: 16
  TEST:
    BATCH_SIZE: 100

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

# OPTIM controls the shared training-loop length. The two trainable branches
# use the independent optimizer nodes under TRAINER.COOPVPT.
OPTIM:
  NAME: "adamw"
  LR: 0.0005
  WEIGHT_DECAY: 0.0001
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 0.00001

TRAIN:
  PRINT_FREQ: 20

TEST:
  PER_CLASS_RESULT: True
  COMPUTE_CMAT: True
  FINAL_MODEL: "best_val"
  BEST_METRIC: "balanced_accuracy"
  SKIP_FINAL_TEST: False

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  COOP:
    # Empty initialization is intentional: N_CTX remains independently
    # searchable instead of being replaced by the number of words in CTX_INIT.
    CTX_INIT: ""
    N_CTX: 4
    CSC: False
    CLASS_TOKEN_POSITION: "end"
  COOPVPT:
    PREC: "amp"
    VPT_ENABLED: False
    VPT_MODE: "shallow"
    VPT_N_CTX: 5
    VPT_DROPOUT: 0.0
    VPT_INIT: "uniform"
    COOP_OPTIM:
      NAME: "adamw"
      LR: 0.0005
      WEIGHT_DECAY: 0.0001
      ADAM_BETA1: 0.9
      ADAM_BETA2: 0.999
      MAX_EPOCH: 100
      LR_SCHEDULER: "cosine"
      WARMUP_EPOCH: 1
      WARMUP_TYPE: "constant"
      WARMUP_CONS_LR: 0.00001
    VPT_OPTIM:
      NAME: "adamw"
      LR: 0.0005
      WEIGHT_DECAY: 0.0001
      ADAM_BETA1: 0.9
      ADAM_BETA2: 0.999
      MAX_EPOCH: 100
      LR_SCHEDULER: "cosine"
      WARMUP_EPOCH: 1
      WARMUP_TYPE: "constant"
      WARMUP_CONS_LR: 0.00001
