DATALOADER:
  # [Windows reproduction] Four workers are stable on the target machine;
  # the upstream Linux configuration used eight.
  NUM_WORKERS: 4
  PERSISTENT_WORKERS: True
  TRAIN_X:
    BATCH_SIZE: 4
  TEST:
    BATCH_SIZE: 100
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

OPTIM:
  NAME: "sgd"
  LR: 0.0025
  MAX_EPOCH: 100
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 1
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 20

# [Reproduction metrics] Emit balanced accuracy, macro/one-vs-rest AUC,
# and per-class precision/recall/specificity/F1 in addition to accuracy.
TEST:
  PER_CLASS_RESULT: True
  COMPUTE_CMAT: True

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BIOMEDCOOP:
    CTX_INIT: "a photo of a"
    SCCM_LAMBDA: 5.0
    KDSP_LAMBDA: 20.0
    TAU: 1.5
    N_PROMPTS: 50
    
